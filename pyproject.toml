[project]
name = "intent-ledger"
version = "0.1.0"
description = "Self-hosted double-entry personal accounting and envelope budgeting."
readme = "README.md"
authors = [
    { name = "Yash", email = "91330011+ycatsh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.1.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.3",
    "xlrd>=2.0.2",
]

[project.scripts]
intent-ledger = "intent_ledger.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-flask>=1.3.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "N", "PERF", "PTH", "ERA",
    "D209", "D301", "D401",
]

[tool.ruff.format]
docstring-code-format = true

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
