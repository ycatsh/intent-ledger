name: Feature request
description: Suggest an idea you'd like added.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is deliberately simple (single currency, no
        live bank sync, server-rendered). Feature requests that go 
        against that will likely be declined.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
